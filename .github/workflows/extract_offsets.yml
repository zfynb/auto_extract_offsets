# ====== 新增：编译 preload.so ======
- name: 安装 NDK
  run: |
    wget -q https://dl.google.com/android/repository/android-ndk-r27-linux.zip
    unzip -q android-ndk-r27-linux.zip
    echo "$(pwd)/android-ndk-r27/build" >> $GITHUB_PATH
    
- name: 编译 preload.so
  run: |
    ndk-build
    
- name: 上传 preload.so
  uses: actions/upload-artifact@v3
  with:
    name: preload
    path: libs/**/libpreload.so
