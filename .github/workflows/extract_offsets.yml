name: 提取内核偏移量

on:
  workflow_dispatch

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 安装依赖
      run: |
        sudo apt-get update
        sudo apt-get install -y python3 python3-pip
        pip3 install vmlinux-to-elf

    - name: 从 Release 下载 boot.img
      run: |
        echo "正在从 Release 下载 boot.img..."
        wget -O boot.img "https://github.com/zfynb/auto_extract_offsets/releases/download/1.0/boot.img"
        if [ -f boot.img ]; then
          echo "下载成功，文件大小：$(du -h boot.img | cut -f1)"
        else
          echo "错误：下载失败"
          exit 1
        fi

    - name: 提取偏移量
      run: |
        python3 auto_extract_offsets.py boot.img -o . --device blazer --target-name target --keep-intermediate
        cp target/target.h ./target.h

    - name: 上传结果
      uses: actions/upload-artifact@v4
      with:
        name: target-h
        path: target.h
        if-no-files-found: error
